<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Remington — Vacant Housing Units</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
body { margin:0; background:#fff; font-family:Arial,Helvetica,sans-serif; }
#chart { width:100%; height: min(680px, 75vw); min-height:440px; }

/* Match the previous 06 poverty chart's responsive dimensions */
.chart-wrapper{box-sizing:border-box;max-width:1150px;width:100%;margin:0 auto;padding:24px 22px 8px;}
#chart{box-sizing:border-box;width:100%;max-width:none;height:690px;min-height:0;margin:0 auto;}
@media(max-width:650px){.chart-wrapper{padding:18px 12px 8px;}#chart{height:490px;min-height:0;}}
</style>
</head>
<body><div class="chart-wrapper">
<div id="chart"></div>
<script>
const periods=['2005–2009','2010–2014','2015–2019','2020–2024'];
const rem=[22.6307189542484,10.0895036615134,13.0952380952381,5.97779675491033];
const city=[19,19,19,14];
const traces=[
 {type:'bar',name:'Remington',x:periods,y:rem,marker:{color:'#103879'},text:rem.map(v=>Math.round(v)+'%'),textposition:'outside',textfont:{size:19,color:'#58697e'},cliponaxis:false,hovertemplate:'Remington<br>%{x}: %{y:.1f}%<extra></extra>'},
 {type:'bar',name:'Baltimore City',x:periods,y:city,marker:{color:'#69aee0'},text:city.map(v=>v+'%'),textposition:'outside',textfont:{size:19,color:'#58697e'},cliponaxis:false,hovertemplate:'Baltimore City<br>%{x}: %{y:.0f}%<extra></extra>'}
];
const layout={
 title:{text:'<b>Vacant housing units, share of all units</b>',x:0.025,xanchor:'left',font:{size:29,color:'#103879'}},
 barmode:'group',bargap:0.20,bargroupgap:0.03,
 margin:{l:85,r:35,t:135,b:85},paper_bgcolor:'white',plot_bgcolor:'white',
 font:{family:'Arial, Helvetica, sans-serif',color:'#58697e'},
 legend:{orientation:'h',x:0.10,y:1.11,xanchor:'left',font:{size:17,color:'#333'}},
 xaxis:{tickfont:{size:18},showline:true,linecolor:'#9ca9b8',ticks:'',fixedrange:false},
 yaxis:{range:[0,45],dtick:5,ticksuffix:'%',tickfont:{size:17},gridcolor:'#d6d6d6',zeroline:false},
 hovermode:'closest',showlegend:true
};
Plotly.newPlot('chart',traces,layout,{responsive:true,displaylogo:false});
</script>
</div></body>
</html>
