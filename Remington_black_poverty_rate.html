<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Poverty rate, Black residents of Remington</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>html,body{margin:0;background:white;font-family:Arial,Helvetica,sans-serif}#chart{width:100%;height:720px}</style></head><body><div id="chart"></div><script>
