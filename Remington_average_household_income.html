<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remington Average Household Income</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#183b77}.wrap{max-width:1120px;margin:30px auto;padding:0 24px}h1{font-size:37px;margin:0 0 10px;font-weight:750;letter-spacing:-.6px}p{font-size:23px;color:#596b83;margin:0 0 16px}#chart{width:100%;height:590px}@media(max-width:650px){h1{font-size:29px}p{font-size:17px}#chart{height:500px}.wrap{padding:0 12px}}</style></head><body><main class="wrap"><h1>Average household income</h1><p>Aggregate household income / households</p><div id="chart"></div></main><script>
const periods=['2005–2009','2009–2014','2014–2019','2019–2024'];
const series=[{name:'Remington',values:[100000,41000,55000,66000],color:'#143c80'},{name:'Baltimore City, Black households',values:[42000,45000,55000,67000],color:'#65a9db'},{name:'Baltimore City, all households',values:[54000,59000,72000,87000],color:'#009788'}];
const traces=series.map(s=>({type:'bar',name:s.name,x:periods,y:s.values,marker:{color:s.color},text:s.values.map(v=>'$'+Math.round(v/1000)+'k'),textposition:'outside',textfont:{size:19,color:'#586c85'},cliponaxis:false,hovertemplate:'%{x}<br>'+s.name+': %{y:$,.0f}<extra></extra>'}));
const layout={paper_bgcolor:'#fff',plot_bgcolor:'#fff',barmode:'group',bargap:.13,bargroupgap:.04,margin:{l:85,r:20,t:105,b:70},font:{family:'Arial, Helvetica, sans-serif',color:'#596b83',size:18},legend:{orientation:'h',x:0,y:1.29,xanchor:'left',yanchor:'bottom',font:{size:17},traceorder:'normal'},xaxis:{showline:true,linecolor:'#a9b5c3',linewidth:1,tickfont:{size:18},showgrid:false,zeroline:false},yaxis:{range:[0,115000],tickvals:[0,20000,40000,60000,80000,100000],ticktext:['$0','$20k','$40k','$60k','$80k','$100k'],tickfont:{size:18},gridcolor:'#dddddd',gridwidth:1,zeroline:false},hovermode:'closest',showlegend:true};
Plotly.newPlot('chart',traces,layout,{responsive:true,displaylogo:false,modeBarButtonsToRemove:['lasso2d','select2d']});
</script></body></html>
