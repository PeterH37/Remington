<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remington Population Change Between Periods</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>html,body{margin:0;background:white;font-family:Arial,Helvetica,sans-serif}#chart{width:100%;height:720px;max-width:1120px;margin:auto}
/* Consistent size with the other Remington charts */
.chart-wrapper{box-sizing:border-box;max-width:1150px;width:100%;margin:0 auto;padding:24px 22px 8px;}
#chart{box-sizing:border-box;width:100%;max-width:none;height:690px;min-height:0;margin:0 auto;}
@media(max-width:650px){.chart-wrapper{padding:18px 12px 8px;}#chart{height:490px;min-height:0;}}
</style>
</head>
<body><div class="chart-wrapper"><div id="chart"></div></div>
<script>
const periods=['2005–09 to 2010–14','2010–14 to 2015–19','2015–19 to 2020–24'];
const populations=[2168,2639,2207,2035];
const remington=populations.slice(1).map((v,i)=>(v/populations[i]-1)*100);
const city=[-2.7,-2.1,-5.9];
const pct=v=>(v>0?'+':'')+v.toFixed(1)+'%';
const traces=[
 {type:'bar',name:'Remington',x:periods,y:remington,marker:{color:'#10377b'},text:remington.map(pct),textposition:'outside',textfont:{size:13,color:'#596b81'},cliponaxis:false,hovertemplate:'Remington<br>%{x}<br>%{y:.1f}%<extra></extra>'},
 {type:'bar',name:'Baltimore City',x:periods,y:city,marker:{color:'#69ade0'},text:city.map(pct),textposition:'outside',textfont:{size:13,color:'#596b81'},cliponaxis:false,hovertemplate:'Baltimore City<br>%{x}<br>%{y:.1f}%<extra></extra>'}
];
const layout={title:{text:'<b>Population change between periods</b><br><span style="font-size:19px;color:#596b81;font-weight:normal">Percent change between consecutive ACS 5-year periods</span>',x:0.04,xanchor:'left',y:0.96,font:{size:30,color:'#10377b'}},barmode:'group',bargap:0.18,bargroupgap:0.02,plot_bgcolor:'white',paper_bgcolor:'white',margin:{l:110,r:55,t:225,b:115},font:{family:'Arial, sans-serif',color:'#596b81',size:18},legend:{orientation:'h',x:0.05,y:1.23,xanchor:'left',font:{size:18,color:'#303030'}},xaxis:{type:'category',tickfont:{size:12},tickangle:0,automargin:true,showgrid:false,zeroline:false,showline:false},yaxis:{range:[-23,28],dtick:10,ticksuffix:'%',gridcolor:'#d6d6d6',gridwidth:1,zeroline:true,zerolinecolor:'#9ca8b5',zerolinewidth:2,tickfont:{size:14}},showlegend:true,hovermode:'closest'};
Plotly.newPlot('chart',traces,layout,{responsive:true,displaylogo:false});
</script></body></html>
