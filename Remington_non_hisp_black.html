<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remington — Non-Hispanic Black Population</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>

</style></head><body><main class="dashboard"><h1 class="heading">Non-Hispanic or Latino Black or African American</h1><p class="subtitle">Share of population</p><div id="chart" role="img" aria-label="Grouped bar chart comparing Remington and Baltimore City Black population share in 2009, 2014, 2019 and 2024"></div></main><script>

</script></body></html>
