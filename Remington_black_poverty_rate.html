<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poverty rate, Black residents of Remington</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:100%;max-width:1150px;margin:auto;padding:30px 34px 12px}.heading{color:#123778;font-size:clamp(23px,3vw,37px);font-weight:750;line-height:1.2;margin:0 0 12px}.sub{color:#586b82;font-size:clamp(15px,2vw,23px);line-height:1.35;margin:0}.plot{width:100%;height:490px;margin-top:18px}@media(max-width:600px){.wrap{padding:22px 16px 8px}.plot{height:360px;margin-top:10px}}</style></head><body><main class="wrap"><h1 class="heading">Poverty rate, Black residents of Remington</h1><p class="sub">Share with income in the past 12 months below the poverty level</p><div id="chart" class="plot" role="img" aria-label="Bar chart showing poverty rates of Black residents in Remington: 4% in 2009, 12% in 2014, 1% in 2019, and 2% in 2024."></div></main><script>const years=['2009','2014','2019','2024'],values=[4,12,1,2];function draw(){const mobile=innerWidth<600;const trace={type:'bar',x:years,y:values,marker:{color:'#123b7c'},width:0.56,text:values.map(v=>v+'%'),textposition:'outside',textfont:{size:mobile?15:19,color:'#566b83'},cliponaxis:false,hovertemplate:'<b>%{x}</b><br>Remington: %{y}%<extra></extra>'};const layout={autosize:true,margin:{l:mobile?52:74,r:mobile?12:40,t:mobile?35:55,b:mobile?45:60},paper_bgcolor:'#fff',plot_bgcolor:'#fff',showlegend:false,bargap:.36,font:{family:'Arial, Helvetica, sans-serif',color:'#586b82'},xaxis:{type:'category',categoryorder:'array',categoryarray:years,tickfont:{size:mobile?15:19},showgrid:false,showline:true,linecolor:'#9ba9b8',linewidth:1.5,zeroline:false,automargin:true,fixedrange:false},yaxis:{range:[0,52],tick0:0,dtick:10,ticksuffix:'%',tickfont:{size:mobile?13:17},gridcolor:'#d9dde2',gridwidth:1,zeroline:false,showline:false,automargin:true},hoverlabel:{bgcolor:'white',font:{color:'#123778',size:15}},dragmode:false};Plotly.react('chart',[trace],layout,{responsive:true,displaylogo:false,modeBarButtonsToRemove:['lasso2d','select2d','autoScale2d']})}draw();addEventListener('resize',draw);</script></body></html>
